spring.application.name=bugzapper
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# JPA (Hibernate)  validate schema only; MyBatis remains primary for repositories until full migration (see docs/QUEUE-03-jpa-migration.md)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

# Database is configured per profile in application-dev.properties and application-prod.properties.
# Local default: dev profile. Production: set SPRING_PROFILES_ACTIVE=prod or export env vars.

