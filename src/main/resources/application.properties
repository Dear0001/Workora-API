minio.region=us-east-1
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=images
# Public URL prefix for objects (bucket + path; must match minio.bucket-name)
minio.public-url-base=http://localhost:9000/images/

