services:

  api:
    build: .
    restart: unless-stopped
    container_name: bugzapper-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
    environment:
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bugzapper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # MinIO
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: images
      MINIO_PUBLIC_URL_BASE: http://localhost:9000/images/

  postgres:
    image: postgres:16
    restart: unless-stopped
    container_name: bugzapper-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bugzapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    container_name: bugzapper-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres-data: